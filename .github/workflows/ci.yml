name: RAG checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: maintenance
          POSTGRES_USER: maintenance
          POSTGRES_PASSWORD: maintenance-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance -d maintenance"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://maintenance:maintenance-test@127.0.0.1:5432/maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt -r requirements-semantic.txt
      - run: python -m pytest -q
      - run: python evaluate.py --split test > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-benchmark
          path: benchmark.json
