services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:0.12.6
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - model-data:/root/.ollama
  models:
    image: ollama/ollama:0.12.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command: ["ollama pull embeddinggemma && ollama pull qwen2.5:1.5b"]
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://maintenance:maintenance-local@postgres:5432/maintenance
      OLLAMA_URL: http://ollama:11434
    command: ["/bin/sh", "-ec", "python semantic.py && exec uvicorn app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres-data:
  model-data:
